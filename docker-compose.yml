
services:
  # 1. PostgreSQL Veritabanı Servisi
  db:
    image: postgres:15-alpine
    container_name: study_planner_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Next.js Uygulama Servisi
  web:
    build: .
    container_name: study_planner_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Buradaki şifreyi de değişkenden alacak şekilde güncelliyoruz
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

# Veritabanı verilerinin konteyner silinse bile kaybolmaması için kalıcı alan (volume)
volumes:
  pgdata: